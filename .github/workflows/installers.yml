# Builds the offline installers (everything bundled, nothing downloaded at install time),
# installs them on a clean path and smoke-tests them, then publishes them as a GitHub Release.
#
# - push to a branch touching packaging/** : build + test, installers kept as workflow artifacts
# - push to main touching packaging/**     : same, and if there is no Release yet for
#                                            v<packaging/VERSION>, publish it (bump VERSION to release).
#                                            If a green branch build already exists for the same shipped
#                                            files (usually the PR you just merged), its installers are
#                                            reused instead of building again (job "reuse").
# - push a tag v*                           : build + test + publish the Release for that tag
# - Actions tab → "Offline installers" → Run workflow : build, and publish if "publish" is ticked
name: Offline installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "packaging/**"
      - ".github/workflows/installers.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (tag v<packaging/VERSION>)"
        type: boolean
        default: false
      intel:
        description: "Also build for Intel Macs"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read     # to find and download the installers of an earlier branch build

# a newer push to the same branch cancels the older build (never on main, where releases happen)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GHC_VERSION: "9.8.4"
  TIDAL_VERSION: "1.10.1"

jobs:
  # On a push to main, look for an earlier successful build of the same shipped files (normally the
  # merged PR's branch build). PR builds and release builds are the same build, so its installers are
  # release-ready: reuse them and skip the 3 build jobs. Nothing found -> output empty -> build as usual.
  # "Same shipped files" = same git tree, ignoring top-level entries that never go into an installer.
  reuse:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find a branch build of the same files
        id: find
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          IGNORE='docs ROADMAP.md tests tools examples'
          key() {  # content key of a commit: top-level tree entries minus the ignored ones
            gh api "repos/$REPO/git/trees/$(gh api "repos/$REPO/commits/$1" --jq .commit.tree.sha)" \
              --jq '.tree[] | "\(.path) \(.sha)"' | while read -r p h; do
                case " $IGNORE " in *" $p "*) ;; *) echo "$p $h" ;; esac
              done | sort | sha256sum | cut -d' ' -f1
          }
          WANT="$(key "$GITHUB_SHA")" || { echo "could not read this commit's tree; building"; exit 0; }
          echo "content key of $GITHUB_SHA: $WANT"
          NEED='TidalStudio-Linux TidalStudio-Windows TidalStudio-macOS-AppleSilicon'
          # filter the conclusion here: the API's ?status=success filter lags and missed a run that had
          # finished green 25 s earlier (0.10.0), so that release was built again
          gh api "repos/$REPO/actions/workflows/installers.yml/runs?event=push&per_page=60" \
            --jq '.workflow_runs[] | select(.head_branch != "main" and .conclusion == "success")
                  | "\(.id) \(.head_sha) \(.head_branch)"' |
          while read -r RUN SHA BRANCH; do
            [ "$(key "$SHA" 2>/dev/null)" = "$WANT" ] || continue
            HAVE="$(gh api "repos/$REPO/actions/runs/$RUN/artifacts?per_page=100" \
                      --jq '.artifacts[] | select(.expired | not) | .name')"
            ok=1; for n in $NEED; do grep -qx "$n" <<<"$HAVE" || ok=0; done
            [ "$ok" = 1 ] || { echo "run $RUN ($BRANCH) matches but its installers are missing or expired"; continue; }
            echo "Reusing the installers of run $RUN ($BRANCH @ $SHA)"
            echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
            echo "Installers reused from [run $RUN]($GITHUB_SERVER_URL/$REPO/actions/runs/$RUN) ($BRANCH), built from the same files." >> "$GITHUB_STEP_SUMMARY"
            break
          done || true
          grep -q '^run_id=' "$GITHUB_OUTPUT" 2>/dev/null || echo "No reusable branch build found: building."

  macos:
    name: macOS ${{ matrix.label }}
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: AppleSilicon
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Skip Intel unless asked
        id: gate
        run: |
          if [ "${{ matrix.label }}" = "Intel" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ] && [ "${{ inputs.intel }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Restore GHC + Tidal cache
        if: steps.gate.outputs.skip != 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Users/Shared/TidalStudio/ghc
            /Users/Shared/TidalStudio/cabal-store
            /Users/Shared/TidalStudio/tidal.env
          key: haskell-${{ runner.os }}-${{ runner.arch }}-ghc${{ env.GHC_VERSION }}-tidal${{ env.TIDAL_VERSION }}-v1

      - name: Build the .pkg
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/macos/build.sh

      - name: Check whether GHC + Tidal were built
        id: hs
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          if [ -f /Users/Shared/TidalStudio/tidal.env ] && [ -e /Users/Shared/TidalStudio/ghc/bin/ghci ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save GHC + Tidal cache
        if: always() && steps.hs.outputs.ok == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Users/Shared/TidalStudio/ghc
            /Users/Shared/TidalStudio/cabal-store
            /Users/Shared/TidalStudio/tidal.env
          key: haskell-${{ runner.os }}-${{ runner.arch }}-ghc${{ env.GHC_VERSION }}-tidal${{ env.TIDAL_VERSION }}-v1

      - name: Install the .pkg on a clean path and smoke-test it
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo mv /Users/Shared/TidalStudio "$RUNNER_TEMP/build-runtime"
          sudo installer -pkg dist/*.pkg -target /
          test -x "/Applications/Tidal Studio.app/Contents/MacOS/TidalStudio"
          test -x "/Users/Shared/TidalStudio/SuperCollider.app/Contents/MacOS/sclang"
          /Users/Shared/TidalStudio/python/bin/python3 packaging/common/smoke_test.py /Users/Shared/TidalStudio

      - name: Open the app, let it load the studio, quit, and check nothing is left running
        if: steps.gate.outputs.skip != 'true'
        run: |
          "/Applications/Tidal Studio.app/Contents/MacOS/TidalStudio" --self-test & APP=$!
          ( sleep 240; echo "app still running after 240 s: killing it"; kill -9 $APP ) & WD=$!
          CODE=0; wait $APP || CODE=$?; kill $WD 2>/dev/null || true
          echo "--- studio log ---"; tail -n 60 "$HOME/Library/Logs/Tidal Studio/studio.log" || true
          [ "$CODE" = 0 ] || { echo "self-test exit code $CODE"; exit 1; }
          sleep 3
          if pgrep -fl "/Users/Shared/TidalStudio/|scsynth|sclang|ghc-9"; then echo "processes left running after quit"; exit 1; fi
          echo "clean shutdown"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: TidalStudio-macOS-${{ matrix.label }}
          path: dist/*.pkg
          compression-level: 0
          retention-days: 30

  linux:
    name: Linux (.deb)
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgmp-dev libffi-dev libnuma-dev zlib1g-dev
          # the cache is restored into /opt, so it must exist and belong to the runner user first
          sudo mkdir -p /opt/tidal-studio && sudo chown "$(id -u):$(id -g)" /opt/tidal-studio

      - name: Restore GHC + Tidal cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/tidal-studio/ghc
            /opt/tidal-studio/cabal-store
            /opt/tidal-studio/tidal.env
          key: haskell-linux-x64-ghc${{ env.GHC_VERSION }}-tidal${{ env.TIDAL_VERSION }}-v1

      - name: Build the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/linux/build.sh

      # (hashFiles() only sees files inside the workspace, so it can't test /opt: the cache was never saved)
      - name: Check whether GHC + Tidal were built
        id: hs
        if: always()
        run: |
          if [ -f /opt/tidal-studio/tidal.env ] && [ -x /opt/tidal-studio/ghc/bin/ghci ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save GHC + Tidal cache
        if: always() && steps.hs.outputs.ok == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/tidal-studio/ghc
            /opt/tidal-studio/cabal-store
            /opt/tidal-studio/tidal.env
          key: haskell-linux-x64-ghc${{ env.GHC_VERSION }}-tidal${{ env.TIDAL_VERSION }}-v1

      - name: Install the .deb on a clean path and smoke-test it
        run: |
          sudo mv /opt/tidal-studio "$RUNNER_TEMP/build-runtime"
          # Recommends would pull the chromium snap (~1.5 min) that the self-test never opens
          sudo apt-get install -y --no-install-recommends ./dist/*.deb sc3-plugins-server
          test -x /usr/bin/tidal-studio
          /opt/tidal-studio/python/bin/python3 packaging/common/smoke_test.py /opt/tidal-studio
          QT_QPA_PLATFORM=offscreen tidal-studio --self-test
          sleep 3
          if pgrep -fl "/opt/tidal-studio/|scsynth|sclang|ghc-9"; then echo "processes left running"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: TidalStudio-Linux
          path: dist/*.deb
          compression-level: 0
          retention-days: 30

  windows:
    name: Windows (Setup.exe)
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Restore GHC + Tidal cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/TidalStudio/ghc
            C:/TidalStudio/cabal-store
            C:/TidalStudio/tidal.env
          key: haskell-windows-x64-ghc${{ env.GHC_VERSION }}-tidal${{ env.TIDAL_VERSION }}-v1

      - name: Build the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/windows/build.sh

      # (hashFiles() only sees files inside the workspace, so it can't test C:/TidalStudio)
      - name: Check whether GHC + Tidal were built
        id: hs
        if: always()
        run: |
          if [ -f /c/TidalStudio/tidal.env ] && [ -f /c/TidalStudio/ghc/bin/ghc.exe ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save GHC + Tidal cache
        if: always() && steps.hs.outputs.ok == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:/TidalStudio/ghc
            C:/TidalStudio/cabal-store
            C:/TidalStudio/tidal.env
          key: haskell-windows-x64-ghc${{ env.GHC_VERSION }}-tidal${{ env.TIDAL_VERSION }}-v1

      - name: Install on a clean path and smoke-test it
        run: |
          mv /c/TidalStudio "$RUNNER_TEMP/build-runtime"
          SETUP="$(ls dist/*Setup.exe | head -1)"
          cmd //c "$(cygpath -w "$SETUP") /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=install.log" || { cat install.log; exit 1; }
          test -f /c/TidalStudio/python/pythonw.exe
          /c/TidalStudio/python/python.exe packaging/common/smoke_test.py 'C:\TidalStudio'
          /c/TidalStudio/python/python.exe 'C:\TidalStudio\bin\launcher.py' --self-test
          sleep 3
          if tasklist | grep -iE "sclang|scsynth|ghc"; then echo "processes left running"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: TidalStudio-Windows
          path: dist/*Setup.exe
          compression-level: 0
          retention-days: 30

  release:
    needs: [reuse, macos, linux, windows]
    # with reuse the build jobs are skipped, so "all needs succeeded" can't be the rule any more
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.publish || github.ref == 'refs/heads/main') &&
      needs.reuse.result == 'success' &&
      (needs.reuse.outputs.run_id != '' ||
       (needs.macos.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the installers built in this run
        if: needs.reuse.outputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Download the installers of the reused branch build
        if: needs.reuse.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: TidalStudio-*
          merge-multiple: true
          run-id: ${{ needs.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$(cat packaging/VERSION)"; fi
          ls -lh dist
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump packaging/VERSION on main to publish a new one."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Tidal Studio $TAG" \
              --notes-file packaging/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/* --clobber
