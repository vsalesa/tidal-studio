<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="398px" preserveAspectRatio="none" style="width:705px;height:398px;background:#F6F1E7;" version="1.1" viewBox="0 0 705 398" width="705px" zoomAndPan="magnify"><title>&lt;size:20&gt;&lt;b&gt;One library: every sound in the same list&lt;/b&gt;&lt;/size&gt;</title><defs/><g><rect fill="#F6F1E7" height="398" style="stroke:none;stroke-width:1.0;" width="705" x="0" y="0"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="460.7715" x="118.6143" y="28.5645">One library: every sound in the same list</text><!--entity b--><g id="elem_b"><rect fill="#FFFDF8" height="52.5938" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="237.1436" x="6" y="56.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="57.5039" x="16" y="79.2764">Built-in</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="217.1436" x="16" y="95.5732">Dirt-Samples, SuperDirt synths</text></g><!--entity il--><g id="elem_il"><rect fill="#FFFDF8" height="52.5938" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="210.9277" x="19" y="127.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="144.6895" x="29" y="150.2764">Instrument library</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="190.9277" x="29" y="166.5732">600+ instruments, engines</text></g><!--entity mine--><g id="elem_mine"><rect fill="#FFFDF8" height="68.8906" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="211.3174" x="19" y="198.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="44.96" x="29" y="221.2764">Yours</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="191.3174" x="29" y="237.5732">uploads, Freesound, packs,</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="184.8643" x="29" y="253.8701">what Maestro downloaded</text></g><!--entity lp--><g id="elem_lp"><rect fill="#FFFDF8" height="36.2969" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="143.1699" x="53" y="285.7813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="123.1699" x="63" y="308.7764">Your long loops</text></g><!--entity kb--><g id="elem_kb"><rect fill="#FFFDF8" height="52.5938" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="176.29" x="36.5" y="340.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="156.29" x="46.5" y="363.2764">Your MIDI keyboard</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="54.9268" x="46.5" y="379.5732">s "midi"</text></g><!--entity idx--><g id="elem_idx"><rect fill="#FBE3DB" height="85.1875" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="169.543" x="279" y="190.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131.8379" x="289" y="213.2764">server/library.py</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="146.8838" x="289" y="229.5732">one entry per sound:</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="135.0781" x="289" y="245.8701">family, kind, origin,</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="149.543" x="289" y="262.167">ready or to download</text></g><!--entity panel--><g id="elem_panel"><rect fill="#FFFDF8" height="68.8906" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="169.8984" x="507" y="154.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="104.7266" x="517" y="177.2764">Library panel</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="100.0234" x="517" y="193.5732">search, filters,</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="149.8984" x="517" y="209.8701">listen, download, add</text></g><!--entity rp--><g id="elem_rp"><rect fill="#FFFDF8" height="68.8906" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="214.4414" x="485" y="241.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="129.4385" x="495" y="264.2764">Replace a sound</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="194.4414" x="495" y="280.5732">select its name in the code:</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="168.6152" x="495" y="296.8701">similar sounds + search</text></g><polygon fill="#5D564A" points="327.7161,190.0545,324.6186,180.7055,324.3515,186.356,318.7009,186.0889,327.7161,190.0545" style="stroke:#5D564A;stroke-width:1.0;"/><path d="M226.5318,109.3504 C232.2238,111.9266 237.7563,114.7313 243,117.7813 C275.3013,136.5691 301.5924,161.3385 323.6786,185.6163 " fill="none" style="stroke:#5D564A;stroke-width:1.4;"/><polygon fill="#5D564A" points="278.9837,201.2278,271.8551,194.4321,274.2755,199.545,269.1625,201.9653,278.9837,201.2278" style="stroke:#5D564A;stroke-width:1.0;"/><path d="M216.7628,180.3604 C225.6522,183.1309 234.5154,185.9651 243,188.7813 C254.6882,192.6608 261.2987,194.9067 273.3338,199.2084 " fill="none" style="stroke:#5D564A;stroke-width:1.4;"/><polygon fill="#5D564A" points="278.7617,232.7813,269.761