<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="398px" preserveAspectRatio="none" style="width:778px;height:398px;background:#F6F1E7;" version="1.1" viewBox="0 0 778 398" width="778px" zoomAndPan="magnify"><title>&lt;size:20&gt;&lt;b&gt;Una sola librer&#237;a: todos los sonidos en la misma lista&lt;/b&gt;&lt;/size&gt;</title><defs/><g><rect fill="#F6F1E7" height="398" style="stroke:none;stroke-width:1.0;" width="778" x="0" y="0"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="595.5273" x="88.2363" y="28.5645">Una sola librer&#237;a: todos los sonidos en la misma lista</text><!--entity b--><g id="elem_b"><rect fill="#FFFDF8" height="52.5938" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="254.4385" x="6" y="56.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71.0117" x="16" y="79.2764">Incluidos</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="234.4385" x="16" y="95.5732">Dirt-Samples, sintes de SuperDirt</text></g><!--entity il--><g id="elem_il"><rect fill="#FFFDF8" height="52.5938" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="233.2607" x="16.5" y="127.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="213.2607" x="26.5" y="150.2764">Biblioteca de instrumentos</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="202.3711" x="26.5" y="166.5732">600+ instrumentos, motores</text></g><!--entity mine--><g id="elem_mine"><rect fill="#FFFDF8" height="68.8906" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="210.0322" x="28" y="198.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.5938" x="38" y="221.2764">Tuyos</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="190.0322" x="38" y="237.5732">subidos, Freesound, packs,</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="172.833" x="38" y="253.8701">lo que descarg&#243; Maestro</text></g><!--entity lp--><g id="elem_lp"><rect fill="#FFFDF8" height="36.2969" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="149.1104" x="58.5" y="285.7813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="129.1104" x="68.5" y="308.7764">Tus loops largos</text></g><!--entity kb--><g id="elem_kb"><rect fill="#FFFDF8" height="52.5938" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="143.6074" x="61" y="340.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="123.6074" x="71" y="363.2764">Tu teclado MIDI</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="54.9268" x="71" y="379.5732">s "midi"</text></g><!--entity idx--><g id="elem_idx"><rect fill="#FBE3DB" height="85.1875" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="172.8926" x="296" y="190.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131.8379" x="306" y="213.2764">server/library.py</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="147.6426" x="306" y="229.5732">una ficha por sonido:</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="141.0596" x="306" y="245.8701">familia, tipo, origen,</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="152.8926" x="306" y="262.167">listo o para descargar</text></g><!-