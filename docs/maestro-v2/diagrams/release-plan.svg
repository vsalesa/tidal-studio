<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="772px" preserveAspectRatio="none" style="width:566px;height:772px;background:#FFFFFF;" version="1.1" viewBox="0 0 566 772" width="566px" zoomAndPan="magnify"><title>Maestro Core release plan: data safe and measured first</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="383.3525" x="90.2954" y="33.5625">Maestro Core release plan: data safe and measured first</text><ellipse cx="239.1943" cy="57.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#E7F0FB" height="63.5586" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="456.3887" x="11" y="87.9395"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="119.8535" x="21" y="109.5645">0.25 Your data, safe</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="436.3887" x="21" y="124.084">data/ folder outside the program, backup before every update and migration,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="336.8496" x="21" y="138.6035">Restore button, songs saved as files, simulated-update test</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="311.457" x="83.4658" y="193.4609"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="81.8145" x="93.4658" y="215.0859">0.26 Measure</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="291.457" x="93.4658" y="229.6055">persistent execution ledger, real tokens per answer</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="379.3262" x="49.5313" y="284.4629"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="231" x="59.5313" y="306.0879">0.27 Understanding + exact commands</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="359.3262" x="59.5313" y="320.6074">parser, RAG/FTS5, single intent contract, Haiku only as fallback</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="337.1328" x="70.6279" y="375.4648"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="260.3613" x="80.6279" y="397.0898">0.28 Local model as the understanding layer</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="317.1328" x="80.6279" y="411.6094">bundled with the app, one on/off button, Mac Metal first</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="316.1094" x="81.1396" y="466.4668"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="139.9863" x="91.1396" y="488.0918">0.29 Hybrid capabilities</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="296.1094" x="91.1396" y="502.6113">bass, rhythm, harmony: the model only fills the gaps</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="295.25" x="91.5693" y="557.4688"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="106.5" x="101.5693" y="579.0938">0.30 Learning Lab</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="275.25" x="101.5693" y="593.6133">evidence-backed candidates, one-click labelling</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="325.6367" x="76.376" y="648.4707"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="171.5098" x="86.376" y="670.0957">0.31 Private GitHub data repo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="305.6367" x="86.376" y="684.6152">memory, executions, learning, prompts; private check</text><ellipse cx="239.1943" cy="750.4727" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="239.1943" cy="750.4727" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="67.9395" y2="87.9395"/><polygon fill="#8A8F98" points="235.1943,77.9395,239.1943,87.9395,243.1943,77.9395,239.1943,81.9395" style="stroke:#8A8F98;stroke-width:1.0;"/><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="151.498" y2="193.4609"/><polygon fill="#8A8F98" points="235.1943,183.4609,239.1943,193.4609,243.1943,183.4609,239.1943,187.4609" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="199.5684" x="243.1943" y="173.3076">Gate: Simulated update loses nothing?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="242.5" y2="284.4629"/><polygon fill="#8A8F98" points="235.1943,274.4629,239.1943,284.4629,243.1943,274.4629,239.1943,278.4629" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="240.8774" x="243.1943" y="264.3096">Gate: Baseline of the latest release measured?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="333.502" y2="375.4648"/><polygon fill="#8A8F98" points="235.1943,365.4648,239.1943,375.4648,243.1943,365.4648,239.1943,369.4648" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="223.5825" x="243.1943" y="355.3115">Gate: Exact commands use 0 Claude calls?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="424.5039" y2="466.4668"/><polygon fill="#8A8F98" points="235.1943,456.4668,239.1943,466.4668,243.1943,456.4668,239.1943,460.4668" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="311.749" x="243.1943" y="446.3135">Gate: Matches Haiku on the corpus without audio dropouts?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="515.5059" y2="557.4688"/><polygon fill="#8A8F98" points="235.1943,547.4688,239.1943,557.4688,243.1943,547.4688,239.1943,551.4688" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="264.5317" x="243.1943" y="537.3154">Gate: Fewer tokens per accepted result, blind A/B?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="606.5078" y2="648.4707"/><polygon fill="#8A8F98" points="235.1943,638.4707,239.1943,648.4707,243.1943,638.4707,239.1943,642.4707" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="217.2339" x="243.1943" y="628.3174">Gate: Nothing activates without approval?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="239.1943" x2="239.1943" y1="697.5098" y2="739.4727"/><polygon fill="#8A8F98" points="235.1943,729.4727,239.1943,739.4727,243.1943,729.4727,239.1943,733.4727" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="241.3555" x="243.1943" y="719.3193">Gate: Restore everything on another computer</text><!--SRC=[TLJBRXGn4BplLpJY5ZOaW80y950IsEIG8CJZmB5dfcV