<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="772px" preserveAspectRatio="none" style="width:596px;height:772px;background:#FFFFFF;" version="1.1" viewBox="0 0 596 772" width="596px" zoomAndPan="magnify"><title>Plan de versiones de Maestro Core: primero datos a salvo y medir</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="447.4531" x="73.0381" y="33.5625">Plan de versiones de Maestro Core: primero datos a salvo y medir</text><ellipse cx="260.2939" cy="57.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#E7F0FB" height="63.5586" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="498.5879" x="11" y="87.9395"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="132.3633" x="21" y="109.5645">0.25 Tus datos a salvo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="459.75" x="21" y="124.084">carpeta data/ fuera del programa, copia antes de cada actualizaci&#243;n y migraci&#243;n,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="478.5879" x="21" y="138.6035">bot&#243;n Restaurar, canciones guardadas en archivo, prueba de actualizaci&#243;n simulada</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="384.7344" x="67.9268" y="193.4609"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="64.3242" x="77.9268" y="215.0859">0.26 Medir</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="364.7344" x="77.9268" y="229.6055">registro de ejecuciones persistente, tokens reales por respuesta</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="401.0234" x="59.7822" y="284.4629"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="194.0391" x="69.7822" y="306.0879">0.27 Entender + &#243;rdenes exactas</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="381.0234" x="69.7822" y="320.6074">parser, RAG/FTS5, ficha de intenci&#243;n &#250;nica, Haiku solo de respaldo</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="410.75" x="54.9189" y="375.4648"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="269.5195" x="64.9189" y="397.0898">0.28 Modelo local como capa de comprensi&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="390.75" x="64.9189" y="411.6094">incluido en la app, un bot&#243;n para encenderlo, primero Mac con Metal</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="328.1563" x="96.2158" y="466.4668"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="157.4648" x="106.2158" y="488.0918">0.29 Capacidades h&#237;bridas</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="308.1563" x="106.2158" y="502.6113">bajo, ritmo, armon&#237;a: el modelo solo rellena los huecos</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="297.2305" x="111.6787" y="557.4688"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="188.0508" x="121.6787" y="579.0938">0.30 Laboratorio de aprendizaje</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="277.2305" x="121.6787" y="593.6133">candidatos con evidencia, etiquetado con un clic</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke:#8A8F98;stroke-width:0.5;" width="424.1328" x="48.2275" y="648.4707"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="219.8027" x="58.2275" y="670.0957">0.31 Repo privado de datos en GitHub</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="404.1328" x="58.2275" y="684.6152">memoria, ejecuciones, aprendizaje, prompts; comprobaci&#243;n de privado</text><ellipse cx="260.2939" cy="750.4727" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="260.2939" cy="750.4727" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="67.9395" y2="87.9395"/><polygon fill="#8A8F98" points="256.2939,77.9395,260.2939,87.9395,264.2939,77.9395,260.2939,81.9395" style="stroke:#8A8F98;stroke-width:1.0;"/><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="151.498" y2="193.4609"/><polygon fill="#8A8F98" points="256.2939,183.4609,260.2939,193.4609,264.2939,183.4609,260.2939,187.4609" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="265.7456" x="264.2939" y="173.3076">Puerta: &#191;La actualizaci&#243;n simulada no pierde nada?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="242.5" y2="284.4629"/><polygon fill="#8A8F98" points="256.2939,274.4629,260.2939,284.4629,264.2939,274.4629,260.2939,278.4629" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="231.4673" x="264.2939" y="264.3096">Puerta: &#191;Medida la &#250;ltima versi&#243;n publicada?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="333.502" y2="375.4648"/><polygon fill="#8A8F98" points="256.2939,365.4648,260.2939,375.4648,264.2939,365.4648,260.2939,369.4648" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="294.959" x="264.2939" y="355.3115">Puerta: &#191;Las &#243;rdenes exactas usan 0 llamadas a Claude?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="424.5039" y2="466.4668"/><polygon fill="#8A8F98" points="256.2939,456.4668,260.2939,466.4668,264.2939,456.4668,260.2939,460.4668" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="293.8579" x="264.2939" y="446.3135">Puerta: &#191;Iguala a Haiku en el corpus sin cortes de audio?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="515.5059" y2="557.4688"/><polygon fill="#8A8F98" points="256.2939,547.4688,260.2939,557.4688,264.2939,547.4688,260.2939,551.4688" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="320.2354" x="264.2939" y="537.3154">Puerta: &#191;Menos tokens por resultado aceptado, A/B a ciegas?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="606.5078" y2="648.4707"/><polygon fill="#8A8F98" points="256.2939,638.4707,260.2939,648.4707,264.2939,638.4707,260.2939,642.4707" style="stroke:#8A8F98;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="207.9956" x="264.2939" y="628.3174">Puerta: &#191;Nada se activa sin aprobaci&#243;n?</text><line style="stroke:#8A8F98;stroke-width:1.0;" x1="260.2939" x2="260.2939" y1="697.5098" y2="739.4727"/><polygon fill="#8A8F98" points="256.2939,729.4727,260.2939,739.4727,264.2939,729.4727,260.2939,733.4727" style="s