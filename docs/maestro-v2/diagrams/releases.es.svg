<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="163px" preserveAspectRatio="none" style="width:1218px;height:163px;background:#F6F1E7;" version="1.1" viewBox="0 0 1218 163" width="1218px" zoomAndPan="magnify"><title>&lt;size:20&gt;&lt;b&gt;Maestro v2: una release cada vez (revisado por Claude)&lt;/b&gt;&lt;/size&gt;</title><defs/><g><rect fill="#F6F1E7" height="163" style="stroke:none;stroke-width:1.0;" width="1218" x="0" y="0"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="629.0039" x="291.498" y="28.5645">Maestro v2: una release cada vez (revisado por Claude)</text><!--entity r14--><g id="elem_r14"><rect fill="#FBE3DB" height="101.4844" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="226.6572" x="6" y="56.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="34.542" x="16" y="79.2764">0.14</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="197.7979" x="16" y="95.5732">Escucha, candados, monitor</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="206.6572" x="16" y="111.8701">A/B a ciegas + dataset JSONL</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="177.8438" x="16" y="128.167">candados por parte, sync</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="144.9834" x="16" y="144.4639">l&#237;mites, monitor RAG</text></g><!--entity r15--><g id="elem_r15"><rect fill="#FFFDF8" height="101.4844" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="191.3154" x="269" y="56.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="34.542" x="279" y="79.2764">0.15</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="162.3945" x="279" y="95.5732">Bloque de composici&#243;n</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="127.4697" x="279" y="111.8701">.tidal + .musicxml</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="145.8242" x="279" y="128.167">melod&#237;as con motivo</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="171.3154" x="279" y="144.4639">"Otra versi&#243;n" en cursos</text></g><!--entity r16--><g id="elem_r16"><rect fill="#FFFDF8" height="101.4844" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="192.792" x="496" y="56.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="34.542" x="506" y="79.2764">0.16</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="157.3154" x="506" y="95.5732">Sonidos que aprenden</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="157.165" x="506" y="111.8701">an&#225;lisis bajo demanda</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="124.5166" x="506" y="128.167">recetas de sonido</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="172.792" x="506" y="144.4639">CLaMP 3 (10+ ejemplos)</text></g><!--entity r17--><g id="elem_r17"><rect fill="#FFFDF8" height="85.1875" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="221.7695" x="725" y="64.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="34.542" x="735" y="87.2764">0.17</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="58.5635" x="735" y="103.5732">G&#233;neros</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="187.0586" x="735" y="119.8701">11 actuales + reggae/dub,</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="201.7695" x="735" y="136.167">hip-hop, afrobeat, &#191;bachata?</text></g><!--entity r18--><g id="elem_r18"><rect fill="#FFFDF8" height="101.4844" rx="7" ry="7" style="stroke:#C9BCA5;stroke-width:0.5;" width="229.9453" x="983" y="56.2813"/><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="34.542" x="993" y="79.2764">0.18</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="123.3408" x="993" y="95.5732">Memoria y estilos</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="172.7988" x="993" y="111.8701">memorias autovalidadas</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="209.9453" x="993" y="128.167">registro reversible, Mis estilos</text><text fill="#1F1C17" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="182.7588" x="993" y="144.4639">panel de almacenamiento</text></g><polygon fill="#5D564A" points="268.7452,106.7813,259.7452,102.7813,263.7452,106.7813,259.7452,110.7813,268.7452,106.7813" style="stroke:#5D564A;stroke-width:1.0;"/><path d="M233.1081,106.7813 C245.0265,106.7813 251.0595,106.7813 262.7452,106.7813 " fill="none" style="stroke:#5D564A;stroke-width:1.4;"/><polygon fill="#5D564A" points="495.8911,106.7813,486.8911,102.7813,490.8911,106.7813,486.8911,110.7813,495.8911,106.7813" style="stroke:#5D564A;stroke-width:1.0;"/><path d="M460.0349,106.7813 C471.8886,106.7813 478.021,106.7813 489.8911,106.7813 " fill="none" style="stroke:#5D564A;stroke-width:1.4;"/><polygon fill="#5D564A" points="724.9711,106.7813,715.9711,1